[versions]
agp = "8.9.0"
kotlin = "2.1.0"
ktor = "3.1.0"
koin = "4.0.2"

[libraries]
ktorCore = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktorOkhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktorOkhttpLogger = "com.squareup.okhttp3:logging-interceptor:4.12.0"
ktorNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktorKotlinxSerialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
koin = { module = "io.insert-koin:koin-core-jvm", version.ref = "koin" }
appcompat = "androidx.appcompat:appcompat:1.7.0"
googleAd = "com.google.android.gms:play-services-ads:24.0.0"
tapsel = "ir.tapsell.sdk:tapsell-sdk-android:4.9.5"
junit = "junit:junit:4.13.2"
kotest = "io.kotest:kotest-assertions-core:5.9.1"
koinTest = { module = "io.insert-koin:koin-test-junit4", version.ref = "koin" }
mockK = "io.mockk:mockk:1.13.13"

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

